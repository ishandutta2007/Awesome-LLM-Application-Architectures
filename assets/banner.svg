<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Awesome LLM Application Architectures banner">
  <title>Awesome-LLM-Application-Architectures</title>
  <desc>Animated banner: LLM serving, inference optimization and production RAG</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224">
        <animate attributeName="stop-color" values="#0b1224;#141b3d;#0b1224" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#101c3a">
        <animate attributeName="stop-color" values="#101c3a;#241348;#101c3a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d0f2b">
        <animate attributeName="stop-color" values="#0d0f2b;#0b1e33;#0d0f2b" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="txtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Ambient moving glows (behind everything else) -->
  <g filter="url(#soft)">
    <circle cx="180" cy="90" r="150" fill="url(#glowA)">
      <animate attributeName="cx" values="180;420;180" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="220" r="170" fill="url(#glowB)">
      <animate attributeName="cx" values="1020;780;1020" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Neural network nodes (subtle, drifting) -->
  <g stroke="#8b93c9" stroke-opacity="0.35" fill="#aab4ff" fill-opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="7s" repeatCount="indefinite"/>
      <line x1="70" y1="60" x2="150" y2="110" stroke-width="1"/>
      <line x1="150" y1="110" x2="90" y2="200" stroke-width="1"/>
      <line x1="150" y1="110" x2="235" y2="70" stroke-width="1"/>
      <circle cx="70" cy="60" r="3.5"/>
      <circle cx="150" cy="110" r="4.5"/>
      <circle cx="90" cy="200" r="3.5"/>
      <circle cx="235" cy="70" r="3"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,6;0,0" dur="8s" repeatCount="indefinite"/>
      <line x1="1130" y1="70" x2="1050" y2="120" stroke-width="1"/>
      <line x1="1050" y1="120" x2="1110" y2="210" stroke-width="1"/>
      <line x1="1050" y1="120" x2="960" y2="80" stroke-width="1"/>
      <circle cx="1130" cy="70" r="3.5"/>
      <circle cx="1050" cy="120" r="4.5"/>
      <circle cx="1110" cy="210" r="3.5"/>
      <circle cx="960" cy="80" r="3"/>
    </g>
  </g>

  <!-- Flowing data streams -->
  <g fill="none" stroke-linecap="round">
    <path d="M0,235 C220,205 380,265 600,235 S980,205 1200,235" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="14 20">
      <animate attributeName="stroke-dashoffset" values="0;-340" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0,255 C260,285 420,215 640,250 S960,285 1200,245" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="10 26">
      <animate attributeName="stroke-dashoffset" values="0;360" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M0,55 C240,25 400,85 620,50 S980,25 1200,55" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 22">
      <animate attributeName="stroke-dashoffset" values="0;280" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating tech pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <g opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="6s" repeatCount="indefinite"/>
      <rect x="34" y="120" rx="13" ry="13" width="86" height="26" fill="#6366f1" fill-opacity="0.35" stroke="#a5b4fc" stroke-opacity="0.7"/>
      <text x="77" y="138" fill="#e0e7ff" text-anchor="middle">vLLM</text>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="7.5s" repeatCount="indefinite"/>
      <rect x="60" y="232" rx="13" ry="13" width="94" height="26" fill="#0891b2" fill-opacity="0.35" stroke="#67e8f9" stroke-opacity="0.7"/>
      <text x="107" y="250" fill="#cffafe" text-anchor="middle">SGLang</text>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="6.6s" repeatCount="indefinite"/>
      <rect x="1074" y="132" rx="13" ry="13" width="82" height="26" fill="#7c3aed" fill-opacity="0.35" stroke="#c4b5fd" stroke-opacity="0.7"/>
      <text x="1115" y="150" fill="#ede9fe" text-anchor="middle">RAG</text>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,9;0,0" dur="8.2s" repeatCount="indefinite"/>
      <rect x="1040" y="238" rx="13" ry="13" width="116" height="26" fill="#0284c7" fill-opacity="0.35" stroke="#7dd3fc" stroke-opacity="0.7"/>
      <text x="1098" y="256" fill="#e0f2fe" text-anchor="middle">KV-Cache</text>
    </g>
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="5.4s" repeatCount="indefinite"/>
      <rect x="248" y="18" rx="12" ry="12" width="84" height="24" fill="#db2777" fill-opacity="0.3" stroke="#f9a8d4" stroke-opacity="0.6"/>
      <text x="290" y="35" fill="#fce7f3" text-anchor="middle">Agents</text>
    </g>
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,6;0,0" dur="7.2s" repeatCount="indefinite"/>
      <rect x="868" y="262" rx="12" ry="12" width="92" height="24" fill="#ea580c" fill-opacity="0.3" stroke="#fdba74" stroke-opacity="0.6"/>
      <text x="914" y="279" fill="#ffedd5" text-anchor="middle">GPU Inf</text>
    </g>
  </g>

  <!-- Animated throughput bar chart (right side, decorative) -->
  <g transform="translate(150,196)">
    <g fill="#34d399" fill-opacity="0.55">
      <rect x="0" y="0" width="10" height="34" rx="3">
        <animate attributeName="height" values="34;18;34" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;16;0" dur="3.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="-6" width="10" height="40" rx="3">
        <animate attributeName="height" values="40;22;40" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-6;12;-6" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="32" y="-14" width="10" height="48" rx="3">
        <animate attributeName="height" values="48;28;48" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-14;6;-14" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="-22" width="10" height="56" rx="3">
        <animate attributeName="height" values="56;34;56" dur="2.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-22;0;-22" dur="2.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Pulsing request particles travelling the streams -->
  <g fill="#fde68a">
    <circle cx="0" cy="235" r="3.4">
      <animate attributeName="cx" values="0;1200" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="252" r="3">
      <animate attributeName="cx" values="1200;0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== FOREGROUND (always on top, never obscured) ===== -->
  <g>
    <rect x="215" y="86" width="770" height="128" rx="18" ry="18" fill="#070b18" fill-opacity="0.88" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="600" y="141" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" filter="url(#txtShadow)">Awesome-LLM-Application-Architectures</text>
    <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#c7d2fe">LLM Model Serving &#183; Inference Optimization &#183; Production RAG Systems</text>
    <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">SaaS platforms &amp; open-source projects compared &#8212; pricing, free tiers &amp; stars</text>
  </g>
</svg>
